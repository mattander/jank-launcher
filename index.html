<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jank Launcher</title>
    <meta name="description" content="Build questionable rockets and launch them across a tiny solar system." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#344e82" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#24375e" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://janklauncher.win/" />
    <meta property="og:title" content="Jank Launcher" />
    <meta property="og:description" content="Build questionable rockets and launch them across a tiny solar system." />
    <meta property="og:image" content="https://janklauncher.win/card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jank Launcher" />
    <meta name="twitter:description" content="Build questionable rockets and launch them across a tiny solar system." />
    <meta name="twitter:image" content="https://janklauncher.win/card.png" />
    <meta name="apple-mobile-web-app-title" content="Jank Launcher" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icons/favicon-32-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      :root {
        color-scheme: light;
        --ink: #2a2118;
        --ink-soft: rgba(42, 33, 24, 0.68);
        --paper: #f3ead6;
        --paper2: #e9dcbf;
        --paper3: #fff7e6;
        --accent: #c84b31;
        --accent2: #3a7d8c;
        --good: #3f7f57;
        --warn: #d98a3d;
        --danger: #c84b31;
        --line: rgba(42, 33, 24, 0.22);
        --on-accent: #fff7e6;
        --panel-bg: color-mix(in srgb, var(--paper) 92%, white);
        --panel-shadow: rgba(42, 33, 24, 0.13);
        --button-shadow: rgba(42, 33, 24, 0.45);
        --modal-scrim: rgba(13, 16, 32, 0.42);
        --toast-glow: rgba(255, 247, 230, 0.52);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --ink: #f4ead8;
          --ink-soft: rgba(244, 234, 216, 0.72);
          --paper: #151b23;
          --paper2: #263140;
          --paper3: #34475e;
          --accent: #f07f4f;
          --accent2: #68bfd0;
          --good: #80c997;
          --warn: #f0b45f;
          --danger: #ff7c5e;
          --line: rgba(244, 234, 216, 0.22);
          --on-accent: #081016;
          --panel-bg: color-mix(in srgb, var(--paper) 86%, #2f3f50);
          --panel-shadow: rgba(0, 0, 0, 0.38);
          --button-shadow: rgba(0, 0, 0, 0.42);
          --modal-scrim: rgba(2, 5, 10, 0.62);
          --toast-glow: rgba(104, 191, 208, 0.18);
        }
      }
      html[data-theme="light"] {
        color-scheme: light;
        --ink: #2a2118;
        --ink-soft: rgba(42, 33, 24, 0.68);
        --paper: #f3ead6;
        --paper2: #e9dcbf;
        --paper3: #fff7e6;
        --accent: #c84b31;
        --accent2: #3a7d8c;
        --good: #3f7f57;
        --warn: #d98a3d;
        --danger: #c84b31;
        --line: rgba(42, 33, 24, 0.22);
        --on-accent: #fff7e6;
        --panel-bg: color-mix(in srgb, var(--paper) 92%, white);
        --panel-shadow: rgba(42, 33, 24, 0.13);
        --button-shadow: rgba(42, 33, 24, 0.45);
        --modal-scrim: rgba(13, 16, 32, 0.42);
        --toast-glow: rgba(255, 247, 230, 0.52);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --ink: #f4ead8;
        --ink-soft: rgba(244, 234, 216, 0.72);
        --paper: #151b23;
        --paper2: #263140;
        --paper3: #34475e;
        --accent: #f07f4f;
        --accent2: #68bfd0;
        --good: #80c997;
        --warn: #f0b45f;
        --danger: #ff7c5e;
        --line: rgba(244, 234, 216, 0.22);
        --on-accent: #081016;
        --panel-bg: color-mix(in srgb, var(--paper) 86%, #2f3f50);
        --panel-shadow: rgba(0, 0, 0, 0.38);
        --button-shadow: rgba(0, 0, 0, 0.42);
        --modal-scrim: rgba(2, 5, 10, 0.62);
        --toast-glow: rgba(104, 191, 208, 0.18);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        cursor: default;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .panel {
        position: absolute;
        background: var(--panel-bg);
        border: 2px solid var(--ink);
        border-radius: 8px;
        box-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 42%, transparent), 0 10px 28px var(--panel-shadow);
        padding: 9px 10px;
        line-height: 1.28;
        backdrop-filter: blur(2px);
      }
      .builder-frame {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(250px, 320px) minmax(220px, 1fr) minmax(250px, 320px);
        grid-template-rows: auto 1fr;
        grid-template-areas:
          "left hint right"
          "left . right";
        gap: 10px;
        min-height: 0;
        padding: 12px;
        pointer-events: none;
      }
      .builder-frame .panel {
        position: relative;
      }
      .builder-rail {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        max-height: calc(100vh - 24px);
        pointer-events: auto;
      }
      .builder-left { grid-area: left; }
      .builder-right { grid-area: right; }
      .builder-palette {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
      }
      .builder-stats {
        flex: 0 1 auto;
        min-height: 130px;
        max-height: 42vh;
        overflow: auto;
      }
      .builder-actions {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      .builder-staging {
        flex: 1 1 auto;
        min-height: 130px;
        overflow: auto;
        font-size: 13px;
      }
      .builder-hint {
        grid-area: hint;
        align-self: start;
        justify-self: center;
        pointer-events: auto;
      }
      .panel.compact { padding: 7px 9px; }
      .panel h1,
      .panel h2,
      .panel h3 {
        margin: 0 0 7px;
        line-height: 1;
        letter-spacing: 0;
      }
      .muted,
      .panel .muted { color: var(--ink-soft); }
      .readout {
        display: grid;
        grid-template-columns: auto auto;
        gap: 3px 12px;
        align-items: baseline;
      }
      .readout span:nth-child(odd) { color: var(--ink-soft); }
      .readout b {
        font-variant-numeric: tabular-nums;
        transition: color 120ms ease, transform 120ms ease;
      }
      .score-pop {
        color: var(--accent);
        animation: score-pop 240ms ease-out;
      }
      .meter { margin-top: 7px; }
      .meter-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
      }
      .meter-track {
        height: 12px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--paper2);
        overflow: hidden;
        margin-top: 3px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .meter-fill {
        height: 100%;
        min-width: 2px;
        transition: width 120ms linear, background-color 160ms ease;
      }
      .chip {
        cursor: pointer;
        display: inline-block;
        margin: 3px 4px 0 0;
        padding: 3px 7px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--paper2);
        color: var(--ink);
        font-size: 12px;
        line-height: 1.1;
        transition: transform 80ms ease, background-color 120ms ease, color 120ms ease;
      }
      .chip:hover { background: var(--paper3); transform: translateY(-1px); }
      .chip.on {
        background: var(--accent2);
        color: var(--on-accent);
      }
      button {
        font-family: inherit;
        font-size: 14px;
        background: var(--paper2);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        box-shadow: 0 2px 0 var(--button-shadow);
        transition: transform 80ms ease, box-shadow 80ms ease, background-color 120ms ease;
      }
      button:hover { background: var(--paper3); transform: translateY(-1px); }
      button:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--button-shadow); }
      button:disabled {
        cursor: default;
        opacity: 0.45;
        transform: none;
        box-shadow: none;
      }
      button:focus-visible,
      .chip:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent2) 55%, white);
        outline-offset: 2px;
      }
      button.primary { background: var(--accent); color: var(--on-accent); }
      button.toggled { background: var(--accent2); color: var(--on-accent); }
      .settings-button {
        position: fixed;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 18;
        width: 42px;
        height: 42px;
        padding: 0;
        display: grid;
        place-items: center;
        font-size: 18px;
      }
      .settings-button:hover { transform: translateY(calc(-50% - 1px)); }
      .settings-button:active { transform: translateY(calc(-50% + 1px)); }
      .settings-button.active {
        background: var(--accent2);
        color: var(--on-accent);
      }
      .parts-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .parts-grid button {
        font-size: 12px;
        padding: 5px 7px;
      }
      .section-label {
        margin: 10px 0 5px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        text-transform: uppercase;
      }
      .hint {
        font-size: 12px;
        max-width: 520px;
        text-align: center;
        transition: transform 180ms ease, background-color 180ms ease;
      }
      .hint.flash {
        background: var(--paper3);
        transform: translateY(2px);
      }
      .toast {
        position: relative;
        font-size: 14px;
        opacity: 1;
        transform: translateY(0) scale(1);
        animation: toast-in 160ms ease-out;
        transition: opacity 0.6s ease, transform 0.6s ease;
        box-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 32%, transparent), 0 0 22px var(--toast-glow);
      }
      .toast.exit {
        opacity: 0;
        transform: translateY(-12px) scale(0.98);
      }
      .stage-row {
        display: grid;
        grid-template-columns: 22px 20px 1fr;
        gap: 5px;
        padding: 5px 0;
        border-top: 1px dashed var(--line);
        align-items: start;
      }
      .map-badge {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        pointer-events: none;
        color: var(--paper3);
        background: rgba(13, 16, 32, 0.72);
        border: 2px solid rgba(255, 247, 230, 0.5);
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        letter-spacing: 0;
      }
      .flight-transition {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        pointer-events: none;
        z-index: 12;
        color: var(--paper3);
        background: radial-gradient(circle at center, rgba(13, 16, 32, 0.18), rgba(13, 16, 32, 0));
        font-size: clamp(28px, 9vw, 86px);
        font-weight: 900;
        letter-spacing: 0;
        text-shadow: 0 3px 0 rgba(42, 33, 24, 0.9), 0 12px 28px rgba(13, 16, 32, 0.28);
        transition: opacity 80ms linear, transform 80ms linear;
      }
      @keyframes score-pop {
        0% { transform: scale(1); }
        45% { transform: scale(1.16); }
        100% { transform: scale(1); }
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(-8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--modal-scrim);
        pointer-events: auto;
        z-index: 20;
      }
      .modal {
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--panel-bg);
        border: 2px solid var(--ink);
        border-radius: 8px;
        box-shadow: 0 2px 0 color-mix(in srgb, var(--ink) 42%, transparent), 0 18px 48px var(--panel-shadow);
        padding: 12px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
        margin-bottom: 10px;
      }
      .stock-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 8px;
      }
      .stock-card {
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: color-mix(in srgb, var(--paper2) 82%, white);
        padding: 9px;
        box-shadow: 0 2px 0 rgba(42, 33, 24, 0.35);
      }
      .stock-card h3 { margin-bottom: 5px; }
      .stock-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 7px 0;
      }
      .mini-pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 6px;
        color: var(--ink-soft);
        font-size: 11px;
        background: color-mix(in srgb, var(--paper3) 48%, transparent);
      }
      .settings-modal {
        width: min(430px, calc(100vw - 32px));
      }
      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .settings-row button {
        min-width: 96px;
      }
      .settings-note {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.45;
      }
      .checklist {
        display: grid;
        gap: 4px;
        margin-top: 7px;
      }
      .check-item {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 5px;
        align-items: start;
        color: var(--ink-soft);
      }
      .check-item.ok { color: var(--good); }
      .check-item.warn { color: var(--danger); }
      @media (max-width: 900px) {
        .builder-frame {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto auto;
          grid-template-areas:
            "hint"
            "left"
            "right";
          align-content: start;
          overflow: auto;
          pointer-events: auto;
        }
        .builder-rail {
          max-height: none;
        }
        .builder-actions {
          justify-content: flex-start;
        }
        .builder-palette {
          max-height: 45vh;
        }
        .builder-stats,
        .builder-staging {
          max-height: 38vh;
        }
      }
      @media (max-width: 560px) {
        .builder-frame {
          padding: 8px;
          gap: 8px;
        }
        .parts-grid button,
        .builder-actions button {
          min-height: 34px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }
      html.motion-off *,
      html.motion-off *::before,
      html.motion-off *::after {
        animation-duration: 1ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
