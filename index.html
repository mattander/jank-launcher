<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jank Launcher</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🚀</text></svg>" />
    <style>
      :root {
        --ink: #2a2118;
        --ink-soft: rgba(42, 33, 24, 0.68);
        --paper: #f3ead6;
        --paper2: #e9dcbf;
        --paper3: #fff7e6;
        --accent: #c84b31;
        --accent2: #3a7d8c;
        --good: #3f7f57;
        --warn: #d98a3d;
        --danger: #c84b31;
        --line: rgba(42, 33, 24, 0.22);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        cursor: default;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .panel {
        position: absolute;
        background: color-mix(in srgb, var(--paper) 92%, white);
        border: 2px solid var(--ink);
        border-radius: 8px;
        box-shadow: 0 2px 0 rgba(42, 33, 24, 0.55), 0 10px 28px rgba(42, 33, 24, 0.13);
        padding: 9px 10px;
        line-height: 1.28;
      }
      .panel.compact { padding: 7px 9px; }
      .panel h1,
      .panel h2,
      .panel h3 {
        margin: 0 0 7px;
        line-height: 1;
        letter-spacing: 0;
      }
      .panel .muted { color: var(--ink-soft); }
      .readout {
        display: grid;
        grid-template-columns: auto auto;
        gap: 3px 12px;
        align-items: baseline;
      }
      .readout span:nth-child(odd) { color: var(--ink-soft); }
      .readout b { font-variant-numeric: tabular-nums; }
      .meter { margin-top: 7px; }
      .meter-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: baseline;
        font-size: 13px;
      }
      .meter-track {
        height: 12px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--paper2);
        overflow: hidden;
        margin-top: 3px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
      .meter-fill {
        height: 100%;
        min-width: 2px;
        transition: width 120ms linear, background-color 160ms ease;
      }
      .chip {
        cursor: pointer;
        display: inline-block;
        margin: 3px 4px 0 0;
        padding: 3px 7px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--paper2);
        color: var(--ink);
        font-size: 12px;
        line-height: 1.1;
        transition: transform 80ms ease, background-color 120ms ease, color 120ms ease;
      }
      .chip:hover { background: var(--paper3); transform: translateY(-1px); }
      .chip.on {
        background: var(--accent2);
        color: #fff7e6;
      }
      button {
        font-family: inherit;
        font-size: 14px;
        background: var(--paper2);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        box-shadow: 0 2px 0 rgba(42, 33, 24, 0.45);
        transition: transform 80ms ease, box-shadow 80ms ease, background-color 120ms ease;
      }
      button:hover { background: var(--paper3); transform: translateY(-1px); }
      button:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(42, 33, 24, 0.45); }
      button:disabled {
        cursor: default;
        opacity: 0.45;
        transform: none;
        box-shadow: none;
      }
      button:focus-visible,
      .chip:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent2) 55%, white);
        outline-offset: 2px;
      }
      button.primary { background: var(--accent); color: #fff7e6; }
      button.toggled { background: var(--accent2); color: #fff7e6; }
      .parts-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .parts-grid button {
        font-size: 12px;
        padding: 5px 7px;
      }
      .section-label {
        margin: 10px 0 5px;
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-soft);
        text-transform: uppercase;
      }
      .hint {
        font-size: 12px;
        max-width: 520px;
        text-align: center;
        transition: transform 180ms ease, background-color 180ms ease;
      }
      .hint.flash {
        background: var(--paper3);
        transform: translateY(2px);
      }
      .toast {
        position: relative;
        font-size: 14px;
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .toast.exit {
        opacity: 0;
        transform: translateY(-12px) scale(0.98);
      }
      .stage-row {
        display: grid;
        grid-template-columns: 22px 20px 1fr;
        gap: 5px;
        padding: 5px 0;
        border-top: 1px dashed var(--line);
        align-items: start;
      }
      .map-badge {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        pointer-events: none;
        color: #fff7e6;
        background: rgba(13, 16, 32, 0.72);
        border: 2px solid rgba(255, 247, 230, 0.5);
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        letter-spacing: 0;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(13, 16, 32, 0.42);
        pointer-events: auto;
        z-index: 20;
      }
      .modal {
        width: min(720px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--paper);
        border: 2px solid var(--ink);
        border-radius: 8px;
        box-shadow: 0 2px 0 rgba(42, 33, 24, 0.55), 0 18px 48px rgba(13, 16, 32, 0.28);
        padding: 12px;
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: start;
        margin-bottom: 10px;
      }
      .stock-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 8px;
      }
      .stock-card {
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: color-mix(in srgb, var(--paper2) 82%, white);
        padding: 9px;
        box-shadow: 0 2px 0 rgba(42, 33, 24, 0.35);
      }
      .stock-card h3 { margin-bottom: 5px; }
      .stock-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 7px 0;
      }
      .mini-pill {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 6px;
        color: var(--ink-soft);
        font-size: 11px;
        background: rgba(255, 247, 230, 0.48);
      }
      .checklist {
        display: grid;
        gap: 4px;
        margin-top: 7px;
      }
      .check-item {
        display: grid;
        grid-template-columns: 18px 1fr;
        gap: 5px;
        align-items: start;
        color: var(--ink-soft);
      }
      .check-item.ok { color: var(--good); }
      .check-item.warn { color: var(--danger); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
